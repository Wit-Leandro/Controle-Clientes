<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css" />
    <title>Controle de Empréstimos</title>

</head>

<body>
    <div id="loginTela">

        <div class="loginBox">

        <h2>🔒 Acesso Restrito</h2>

        <input
            type="password"
            id="senhaLogin"
            placeholder="Digite a senha"
            onkeydown="enterLogin(event)"
            >

        <button onclick="fazerLogin()">Entrar</button>

        </div>

    </div>
    <div id="sistema" style="display:none;">

        <div class="resumo">

            <div class="cardResumo">
                💵 Total Emprestado<br>
                R$ <span id="totalEmprestado">0.00</span>
            </div>

            <div class="cardResumo">
                🏦 Total a Receber<br>
                R$ <span id="totalReceber">0.00</span>
            </div>

            <div class="cardResumo">
                📒 Empréstimos Ativos<br>
                <span id="totalAtivos">0</span>
            </div>
            <button onclick="fazerBackup()">💾 Backup</button>

        </div>
        <span>Restaurar backup: </span><input type="file" id="restaurarArquivo" accept=".json" onchange="restaurarBackup(event)">
        <button id="btnNovo" onclick="toggleFormulario()"> + Novo Empréstimo</button>

        <div class="formulario" id="formulario" style="display:none;">

            <input type="text" id="nome" placeholder="Nome do cliente">

            <input type="date" id="data">

            <input type="number" id="valor" placeholder="Valor emprestado">

            <input type="number" id="juros" placeholder="Juros % (ex: 30)">

            <input type="number" id="periodo" placeholder="Período em dias">

            <button onclick="adicionarEmprestimo()">
                + Adicionar Empréstimo
            </button>

        </div>

        <div class="lista" id="listaClientes"></div>
    </div>    
    <script src="script.js"></script>
</body>

</html>
